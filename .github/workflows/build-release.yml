name: Build & Release EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:


permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      
      - name: Build EXE
        run: |
          pyinstaller --noconsole --onefile --name "Syntiox-DL" --icon "assets/icon.ico" --collect-all customtkinter --add-data "core;core" --add-data "assets;assets" main.py

      - name: Build Installer (Inno Setup)
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Upload EXE to Release
        uses: softprops/action-gh-release@v2
        with:
          name: "🚀 Syntiox DL - ${{ github.ref_name }}"
          generate_release_notes: true
          body: |
            ## 🎉 Update ${{ github.ref_name }} is here!
            
            We've updated Syntiox DL to make your downloading experience even better.
            
            ### ✨ Developer Notes:
            ```text
            ${{ github.event.head_commit.message }}
            ```
            
            ---
            **⬇️ Download the `Syntiox DL.exe` file below to install this update!**
          files: 'dist/Syntiox DL.exe'
